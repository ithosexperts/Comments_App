<script>
document.addEventListener("DOMContentLoaded", function() {
  const input = document.getElementById("comment-input");
  const dropdown = document.getElementById("main-mention-dropdown");
  if (input && dropdown) setActiveMentionContext(input, dropdown);
  if (typeof initializeUsersDirectory === "function") initializeUsersDirectory();

});

document.addEventListener("input", function(e) {
  if (e.target && e.target.id === "comment-input") {
    mentionState.active = true;
    handleMentions(e.target);
    if (typeof onInput === 'function') onInput(e.target, 'main');
  }
  
  if (e.target && e.target.id && e.target.id.startsWith("reply-input-")) {
    const contextId = e.target.id.replace('reply-input-', '');
    mentionState.active = true;
    handleMentions(e.target);
    if (typeof onInput === 'function') onInput(e.target, contextId);
  }
});

document.addEventListener("keydown", function(e) {
  if (e.target && (e.target.id === "comment-input" || (e.target.id && e.target.id.startsWith("reply-input-")))) {
    handleMentionKeys(e);
  }
});

document.addEventListener("change", function(e) {
  if (e.target && (e.target.name === "mentionType" || e.target.classList.contains("type-bubble") || e.target.type === "radio")) {
    const mainInputEl = document.getElementById('comment-input');
    if (mainInputEl && typeof onInput === 'function') onInput(mainInputEl, 'main'); 
  }
});

function setActiveMentionContext(inputEl, dropdownEl) {
  mentionState.inputEl = inputEl;
  mentionState.dropdownEl = dropdownEl;
}

function handleMentions(inputEl) {
  const selection = window.getSelection();
  if (!selection.rangeCount || !inputEl.contains(selection.anchorNode)) return;
  const range = selection.getRangeAt(0);
  const textUpToCursor = range.startContainer.textContent.substring(0, range.startOffset);
  
  const atMatch = textUpToCursor.match(/(?:^|\s)@(\w*)$/);
  if (atMatch) {
    mentionState.startPos = textUpToCursor.lastIndexOf('@');
    mentionState.query = atMatch[1].toLowerCase();
    const filteredUsers = usersList.filter(u => u.name.toLowerCase().includes(mentionState.query) || u.email.toLowerCase().includes(mentionState.query));
    if (filteredUsers.length > 0) showMentionDropdown(filteredUsers);
    else if(mentionState.dropdownEl) mentionState.dropdownEl.classList.add('hidden');
  } else {
    if(mentionState.dropdownEl) mentionState.dropdownEl.classList.add('hidden');
  }
}

function showMentionDropdown(users) {
  if (!mentionState.dropdownEl) return;
  mentionState.dropdownEl.innerHTML = users.map((user) => `
    <div class="mention-option p-2 cursor-pointer hover:bg-gray-100" data-name="${escapeHTML(user.name)}" data-email="${escapeHTML(user.email)}">
      <div class="font-bold text-sm">${escapeHTML(user.name)}</div>
      <div class="text-xs text-gray-500">${escapeHTML(user.email)}</div>
    </div>
  `).join('');
  
  mentionState.dropdownEl.querySelectorAll('.mention-option').forEach(option => {
    option.addEventListener('click', (e) => selectMention(e.currentTarget.dataset.name, e.currentTarget.dataset.email));
  });
  
  mentionState.dropdownEl.classList.remove('hidden');
  if (mentionState.dropdownEl.children.length > 0) mentionState.dropdownEl.children[0].classList.add('selected');
}

function selectMention(name, email) {
  const inputEl = mentionState.inputEl;
  if (!inputEl) return;
  inputEl.focus();
  
  if (inputEl.id === 'comment-input') {
      if (composerState.recipients.length >= 10) {
          alert("Maximum 10 users allowed per thread.");
          mentionState.dropdownEl.classList.add('hidden');
          return;
      }
      const exists = composerState.recipients.find(r => r.email === email);
      if (!exists) {
          composerState.recipients.push({
              name: name, email: email, type: composerState.globalType || 'Message', customText: '', id: Date.now() + Math.random()
          });
      }
      renderDynamicComposerUI();
  }

  const selection = window.getSelection();
  if (!selection.rangeCount) return;
  const range = selection.getRangeAt(0);
  const walker = document.createTreeWalker(inputEl, NodeFilter.SHOW_TEXT, null, false);
  let node;
  while (node = walker.nextNode()) {
    const atIndex = node.nodeValue.lastIndexOf('@' + mentionState.query);
    if (atIndex !== -1) {
      range.setStart(node, atIndex);
      range.setEnd(node, atIndex + mentionState.query.length + 1);
      break;
    }
  }
  range.deleteContents();
  
  const bubble = document.createElement('span');
  bubble.className = 'mention-bubble';
  bubble.setAttribute('contenteditable', 'false');
  bubble.setAttribute('data-email', email);
  bubble.textContent = `@${name}`;
  
  range.insertNode(bubble);
  range.setStartAfter(bubble);
  range.collapse(true);
  
  selection.removeAllRanges();
  selection.addRange(range);
  document.execCommand('insertText', false, '\u00A0');
  
  if (mentionState.dropdownEl) mentionState.dropdownEl.classList.add('hidden');
  
  const isReply = inputEl.id.startsWith('reply-input-');
  const contextId = isReply ? inputEl.id.replace('reply-input-', '') : 'main';
  onInput(inputEl, contextId);
}

function handleMentionKeys(e) {
  if (!mentionState.active || !mentionState.dropdownEl || mentionState.dropdownEl.classList.contains('hidden')) return;
  
  const options = Array.from(mentionState.dropdownEl.children);
  if (options.length === 0) return;
  let currentIndex = options.findIndex(opt => opt.classList.contains('selected'));
  
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    options[currentIndex]?.classList.remove('selected');
    const nextIndex = e.key === 'ArrowDown' ? (currentIndex + 1) % options.length : (currentIndex - 1 + options.length) % options.length;
    options[nextIndex]?.classList.add('selected');
    options[nextIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    if (currentIndex > -1) {
      const selectedOption = options[currentIndex];
      selectMention(selectedOption.dataset.name, selectedOption.dataset.email);
    }
    mentionState.dropdownEl.classList.add('hidden');
  } else if (e.key === 'Escape') {
    mentionState.dropdownEl.classList.add('hidden');
  }
}

function populateEmojiPicker() {
  const picker = document.getElementById('emoji-picker');
  const emojis = ['✅', '❌', '⏳', '🔁', '📌', '📎', '📝', '💬', '📢', '🔥', '🔍', '🤝', '🙏', '🤔', '💡', '✨', '🎉', '💻', '👏', '📈', '🚀', '📤', '📥', '🆕', '👋', '👤', '🧑‍💻', '🧑‍🔧', '🏆'];
  picker.innerHTML = emojis.map(emoji => `<button class="p-1 text-2xl rounded-md hover:bg-gray-200">${emoji}</button>`).join('');
  
  picker.querySelectorAll('button').forEach(btn => {
    btn.onmousedown = (e) => e.preventDefault();
    btn.onclick = () => {
      const inputEl = mentionState.inputEl || document.getElementById('comment-input');
      insertAtCursor(inputEl, btn.textContent);
      picker.classList.add('hidden');
      const contextId = inputEl.id === 'comment-input' ? 'main' : inputEl.id.replace('reply-input-', '');
      onInput(inputEl, contextId);
    };
  });
}

function toggleEmojiPicker() {
  const picker = document.getElementById('emoji-picker');
  const mainInput = document.getElementById('comment-input');
  
  picker.style.position = 'absolute';
  picker.style.top = 'auto';
  picker.style.left = 'auto';
  picker.style.right = 'auto';
  picker.style.bottom = '100%'; 
  
  if (!picker.classList.contains('hidden') && mentionState.inputEl === mainInput) {
    picker.classList.add('hidden');
  } else {
    picker.classList.remove('hidden');
    mentionState.inputEl = mainInput;
  }
}

function insertAtCursor(el, text) {
  el.focus(); document.execCommand('insertText', false, text);
}

function getSubmissionData(inputEl) {
    const bubbles = inputEl.querySelectorAll('.mention-bubble');
    const mentionedEmails = [];
    bubbles.forEach(b => mentionedEmails.push(b.getAttribute('data-email')));
    const clone = inputEl.cloneNode(true);
    clone.querySelectorAll('.mention-bubble').forEach(b => b.replaceWith(b.textContent));
    let textForSheet = clone.innerText || clone.textContent;
    return { textForSheet, mentionedEmails };
}

function submitComment(text, mentions, fileData, type, parentAskId) {
    let receiver = '';
    if (mentions.length > 0) {
        receiver = mentions.join(',');
    } else {
        if(parentAskId) {
             const originalAsk = allComments.find(c => c.askId === parentAskId);
             receiver = originalAsk ? originalAsk.sender : document.getElementById('manager-email').textContent;
        } else {
             receiver = document.getElementById('manager-email').textContent;
        }
    }
    
    const data = {
        commentId,
        taskId: document.getElementById('task-id').textContent,
        stageName: document.querySelector('.px-3.py-1').textContent.trim(),
        fmsName: document.querySelector('h1').textContent.trim(),
        tableName: CURRENT_TABLE_NAME, fmsRefId: CURRENT_FMS_REF_ID, appId: CURRENT_APP_ID, appName: CURRENT_APP_NAME || document.querySelector('h1').textContent.trim(), stageNo: CURRENT_STAGE_NO,
        text: text,
        sender: CURRENT_USER_EMAIL,
        receiver: receiver,
        mentionType: type || 'Message',
        parentAskId: parentAskId
    };
    
    google.script.run.withSuccessHandler(() => {
        loadComments();
        if(parentAskId) {
            if(document.getElementById(`reply-composer-${parentAskId}`)) {
                toggleReplyBox(parentAskId);
                resetReplyFile(parentAskId);
            }
        } else {
            resetMainComposer();
        }
        hideLoader();
    }).addNewComment(data);
}
</script>
